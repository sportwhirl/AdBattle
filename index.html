<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AdBattle</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f5f7;
    color: #202124;
}

/* HEADER */

header {
    background: white;
    border-bottom: 1px solid #e4e4e4;
}

.topbar {
    width: min(1200px, 94%);
    margin: auto;
    padding: 22px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 25px;
}

.logo {
    font-size: 1.8rem;
    font-weight: 800;
    cursor: pointer;
}

.logo span {
    color: #654cff;
}

nav {
    display: flex;
    align-items: center;
    gap: 8px;
}

nav button {
    border: 0;
    background: transparent;
    padding: 11px 15px;
    border-radius: 9px;
    font-size: .95rem;
    font-weight: 600;
    cursor: pointer;
}

nav button:hover {
    background: #f1f1f3;
}

nav button.active {
    background: #202124;
    color: white;
}

nav .post-button {
    background: #654cff;
    color: white;
    padding-left: 19px;
    padding-right: 19px;
}

nav .post-button:hover {
    background: #543bea;
}

/* HERO */

.hero {
    text-align: center;
    padding: 55px 20px 35px;
}

.hero h1 {
    margin: 0;
    font-size: clamp(2.2rem, 5vw, 3.7rem);
}

.hero p {
    max-width: 600px;
    margin: 14px auto 0;
    color: #6b6b6b;
    font-size: 1.08rem;
    line-height: 1.5;
}

/* GALLERY */

.gallery {
    width: min(1100px, 92%);
    margin: auto;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 25px;
    padding-bottom: 70px;
}

.card {
    background: white;
    border-radius: 17px;
    overflow: hidden;
    box-shadow: 0 3px 15px rgba(0,0,0,.07);
    transition: transform .2s ease, box-shadow .2s ease;
}

.card:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 25px rgba(0,0,0,.11);
}

.image-container {
    position: relative;
}

.card img {
    display: block;
    width: 100%;
    height: 300px;
    object-fit: cover;
}

.rank {
    position: absolute;
    top: 12px;
    left: 12px;
    background: rgba(0,0,0,.78);
    color: white;
    padding: 7px 11px;
    border-radius: 20px;
    font-size: .9rem;
    font-weight: bold;
}

.caption {
    padding: 19px;
}

.caption h2 {
    margin: 0 0 8px;
    font-size: 1.22rem;
}

.caption p {
    margin: 0 0 18px;
    color: #666;
    line-height: 1.45;
}

/* STATS */

.stats {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    border-top: 1px solid #eee;
    padding-top: 15px;
    font-size: .9rem;
}

.like-count {
    color: #666;
    font-weight: normal;
}

.money {
    font-weight: normal;
}

.gallery.show-support .money {
    font-weight: bold;
}

.gallery.show-likes .like-count {
    font-weight: bold;
    color: #202124;
}

/* ACTIONS */

.action-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 15px;
}

.like-button,
.support-button {
    padding: 12px;
    border-radius: 9px;
    font-size: .95rem;
    font-weight: 700;
    cursor: pointer;
}

.like-button {
    border: 1px solid #ccc;
    background: white;
    color: #222;
}

.like-button:hover {
    background: #f5f5f5;
}

.like-button.liked {
    background: #202124;
    border-color: #202124;
    color: white;
}

.support-button {
    border: none;
    background: #654cff;
    color: white;
}

.support-button:hover {
    background: #543bea;
}

/* OWNER CONTROLS */

.edit-ad-button {
    width: 100%;
    margin-top: 12px;
    padding: 10px;
    background: white;
    border: 1px solid #d8d8d8;
    border-radius: 9px;
    color: #333;
    font-weight: 700;
    cursor: pointer;
}

.edit-ad-button:hover {
    background: #f5f5f5;
}

/* EDIT MODAL */

.edit-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: rgba(0,0,0,.45);
    padding: 24px;
    overflow-y: auto;
}

.edit-panel {
    width: min(540px, 100%);
    margin: 40px auto;
    background: white;
    border-radius: 17px;
    padding: 28px;
    box-shadow: 0 18px 60px rgba(0,0,0,.22);
}

.edit-panel h2 {
    margin: 0 0 22px;
}

.edit-panel label {
    display: block;
    margin-bottom: 6px;
    font-weight: 700;
}

.edit-panel input,
.edit-panel textarea {
    width: 100%;
    padding: 12px;
    margin-bottom: 17px;
    border: 1px solid #ccc;
    border-radius: 9px;
    font: inherit;
}

.edit-panel textarea {
    min-height: 110px;
    resize: vertical;
}

.edit-save-button {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 9px;
    background: #654cff;
    color: white;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
}

.edit-cancel-button {
    width: 100%;
    margin-top: 8px;
    padding: 11px;
    border: none;
    background: transparent;
    color: #666;
    cursor: pointer;
}

.danger-zone {
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid #e8e8e8;
}

.danger-zone strong {
    display: block;
    margin-bottom: 6px;
}

.danger-zone p {
    margin: 0 0 12px;
    color: #777;
    font-size: .92rem;
}

.delete-ad-button {
    width: 100%;
    padding: 11px;
    background: white;
    border: 1px solid #d33;
    border-radius: 9px;
    color: #c22;
    font-weight: 700;
    cursor: pointer;
}

.delete-ad-button:hover {
    background: #fff4f4;
}

/* SUPPORT BOX */

.support-box {
    margin-top: 14px;
    padding: 17px;
    background: #f6f6f8;
    border-radius: 11px;
}

.support-question {
    font-weight: 700;
    margin-bottom: 11px;
}

.amount-entry {
    display: flex;
    align-items: center;
    background: white;
    border: 2px solid #ddd;
    border-radius: 9px;
    padding: 0 13px;
    margin-bottom: 10px;
}

.amount-entry:focus-within {
    border-color: #654cff;
}

.amount-entry span {
    font-size: 1.3rem;
    font-weight: bold;
}

.amount-entry input {
    width: 100%;
    border: none;
    outline: none;
    padding: 12px 8px;
    font-size: 1.2rem;
    font-weight: bold;
    background: transparent;
}

.confirm-support {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 9px;
    background: #654cff;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

.cancel-support {
    width: 100%;
    padding: 9px;
    margin-top: 3px;
    border: none;
    background: transparent;
    color: #777;
    cursor: pointer;
}

/* SHARED FORMS */

.submit-area,
.auth-area {
    display: none;
    width: min(620px, 92%);
    margin: 10px auto 70px;
    background: white;
    padding: 30px;
    border-radius: 17px;
    box-shadow: 0 4px 20px rgba(0,0,0,.08);
}

.auth-area {
    width: min(450px, 92%);
}

.submit-area h2,
.auth-area h2 {
    margin-top: 0;
}

.auth-description {
    color: #666;
    line-height: 1.5;
    margin-bottom: 25px;
}

.submit-area label,
.auth-area label {
    display: block;
    font-weight: 600;
    margin-bottom: 6px;
}

.submit-area input,
.submit-area textarea,
.auth-area input {
    width: 100%;
    border: 1px solid #ccc;
    border-radius: 9px;
    padding: 13px;
    margin-bottom: 18px;
    font: inherit;
}

.submit-area textarea {
    height: 110px;
    resize: vertical;
}

.publish-button,
.auth-main-button,
.auth-secondary-button {
    width: 100%;
    padding: 13px;
    border-radius: 9px;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
}

.publish-button,
.auth-main-button {
    border: none;
    background: #654cff;
    color: white;
}

.auth-secondary-button {
    margin-top: 10px;
    background: white;
    border: 1px solid #ccc;
}

#authMessage {
    margin-top: 17px;
    text-align: center;
    color: #666;
    line-height: 1.4;
}

/* PROFILE */

.profile {
    display: none;
    width: min(1100px, 92%);
    margin: 0 auto 70px;
}

.profile-header {
    background: white;
    padding: 25px;
    border-radius: 16px;
    box-shadow: 0 3px 15px rgba(0,0,0,.06);
    margin-bottom: 25px;
}

.profile-header h2 {
    margin: 0 0 6px;
}

.username {
    color: #777;
}

.logout-button {
    margin-top: 12px;
    padding: 0;
    border: 0;
    background: transparent;
    color: #777;
    cursor: pointer;
}

.profile-tabs {
    display: flex;
    gap: 8px;
    margin-top: 22px;
    flex-wrap: wrap;
}

.profile-tabs button {
    padding: 10px 18px;
    border: none;
    border-radius: 8px;
    background: #eee;
    font-weight: 600;
    cursor: pointer;
}

.profile-tabs button.active {
    background: #202124;
    color: white;
}

.profile-content {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 25px;
}

.empty-message {
    grid-column: 1 / -1;
    background: white;
    padding: 45px 20px;
    border-radius: 15px;
    text-align: center;
    color: #777;
}

/* MOBILE */

@media (max-width: 760px) {
    .topbar {
        flex-direction: column;
        padding: 17px 0;
    }

    nav {
        justify-content: center;
        flex-wrap: wrap;
    }

    nav button {
        padding: 9px 11px;
        font-size: .88rem;
    }

    .hero {
        padding-top: 38px;
    }

    .stats {
        flex-direction: column;
    }
}
</style>
</head>

<body>

<header>
    <div class="topbar">
        <div class="logo" onclick="showSupported()">
            Ad<span>Battle</span>
        </div>

        <nav>
            <button
                id="supportedNav"
                class="active"
                onclick="showSupported()"
            >
                ⚡ Most Supported
            </button>

            <button
                id="likedNav"
                onclick="showMostLiked()"
            >
                ♡ Most Liked
            </button>

            <button
                class="post-button"
                onclick="showPost()"
            >
                + POST AN AD
            </button>

            <button
                type="button"
                id="profileNav"
            >
                👤 Log In
            </button>
        </nav>
    </div>
</header>

<section class="hero">
    <h1 id="pageTitle">Most Supported</h1>
    <p id="pageDescription">
        The ads people have put the most support behind.
    </p>
</section>

<main class="gallery" id="gallery"></main>

<!-- LOGIN -->

<section class="auth-area" id="authArea">
    <h2>Log In</h2>

    <p class="auth-description">
        Log in to post ads, like ads and manage your profile.
    </p>

    <label>Email</label>
    <input
        id="authEmail"
        type="email"
        placeholder="you@example.com"
    >

    <label>Password</label>
    <input
        id="authPassword"
        type="password"
        placeholder="Password"
    >

    <button
        class="auth-main-button"
        onclick="login()"
    >
        Log In
    </button>

    <button
        class="auth-secondary-button"
        onclick="signup()"
    >
        Create Account
    </button>

    <div id="authMessage"></div>
</section>

<!-- POST AN AD -->

<section class="submit-area" id="submitArea">
    <h2>Post an Ad</h2>

    <label>Title</label>
    <input
        id="newTitle"
        type="text"
        placeholder="Give your ad a title"
    >

    <label>Choose Image</label>
    <input
        id="newImage"
        type="file"
        accept="image/jpeg,image/png,image/webp,image/gif"
    >

    <label>Caption</label>
    <textarea
        id="newCaption"
        placeholder="What does your ad say?"
    ></textarea>

    <button
        class="publish-button"
        onclick="postAd()"
    >
        + Post Ad
    </button>
</section>

<!-- PROFILE -->

<section class="profile" id="profile">
    <div class="profile-header">
        <h2>Profile</h2>

        <div
            class="username"
            id="profileUsername"
        >
            Account
        </div>

        <button
            class="logout-button"
            onclick="logout()"
        >
            Log Out
        </button>

        <div class="profile-tabs">
            <button
                id="myAdsTab"
                class="active"
                onclick="profileSection('myads')"
            >
                My Ads
            </button>

            <button
                id="myLikesTab"
                onclick="profileSection('liked')"
            >
                Liked
            </button>

            <button
                id="mySupportedTab"
                onclick="profileSection('supported')"
            >
                Supported
            </button>
        </div>
    </div>

    <div
        class="profile-content"
        id="profileContent"
    ></div>
</section>

<!-- EDIT AD -->

<div class="edit-overlay" id="editOverlay">
    <div class="edit-panel">
        <h2>Edit Ad</h2>

        <label>Title</label>
        <input
            id="editTitle"
            type="text"
            placeholder="Ad title"
        >

        <label>Caption</label>
        <textarea
            id="editCaption"
            placeholder="Ad caption"
        ></textarea>

        <label>Replace image (optional)</label>
        <input
            id="editImage"
            type="file"
            accept="image/jpeg,image/png,image/webp,image/gif"
        >

        <button
            class="edit-save-button"
            onclick="saveAdEdits()"
        >
            Save Changes
        </button>

        <button
            class="edit-cancel-button"
            onclick="closeEditAd()"
        >
            Cancel
        </button>

        <div class="danger-zone">
            <strong>Delete this ad</strong>
            <p>
                This permanently removes the ad and its uploaded image.
            </p>

            <button
                class="delete-ad-button"
                onclick="deleteCurrentAd()"
            >
                Delete Ad
            </button>
        </div>
    </div>
</div>

<!-- SUPABASE LIBRARY -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* ========================================
   SUPABASE
======================================== */

const SUPABASE_URL =
    "https://bmsrdzqprxvldltaislp.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable__DHmkTcq5Utga1QQHn1smg_09D9Nqrd";

const db =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );

let currentUser = null;
let ads = [];

/* ========================================
   ELEMENTS
======================================== */

const gallery =
    document.getElementById("gallery");

const submitArea =
    document.getElementById("submitArea");

const authArea =
    document.getElementById("authArea");

const profilePanel =
    document.getElementById("profile");

const profileNavButton =
    document.getElementById("profileNav");

const profileContent =
    document.getElementById("profileContent");

const pageTitle =
    document.getElementById("pageTitle");

const pageDescription =
    document.getElementById("pageDescription");

const editOverlay =
    document.getElementById("editOverlay");

const editTitle =
    document.getElementById("editTitle");

const editCaption =
    document.getElementById("editCaption");

const editImage =
    document.getElementById("editImage");

let editingAdId = null;

/* ========================================
   AUTH
======================================== */

async function checkUser() {
    const {
        data: { user },
        error
    } = await db.auth.getUser();

    if (error) {
        console.log("No logged-in user.");
    }

    currentUser = user || null;
    updateAccountButton();
}

function updateAccountButton() {
    const button =
        document.getElementById("profileNav");

    if (currentUser) {
        button.innerText = "👤 Profile";

        document
            .getElementById("profileUsername")
            .innerText = currentUser.email;
    } else {
        button.innerText = "👤 Log In";

        document
            .getElementById("profileUsername")
            .innerText = "Account";
    }
}

async function handleProfileClick() {
    /*
        Re-check the current Supabase session when Profile is clicked.
        This makes the button reliable even after refreshes or auth changes.
    */
    const {
        data: { user }
    } = await db.auth.getUser();

    currentUser = user || null;
    updateAccountButton();

    if (currentUser) {
        await loadAds();
        showProfile();
    } else {
        showLogin();
    }
}

profileNavButton.addEventListener(
    "click",
    handleProfileClick
);

function showLogin() {
    hideAll();

    authArea.style.display = "block";

    pageTitle.innerText =
        "Welcome to AdBattle";

    pageDescription.innerText =
        "Log in or create an account to join the battle.";

    setNav("profileNav");
}

async function signup() {
    const email =
        document.getElementById("authEmail").value.trim();

    const password =
        document.getElementById("authPassword").value;

    const message =
        document.getElementById("authMessage");

    if (!email || !password) {
        message.innerText =
            "Enter an email and password.";
        return;
    }

    message.innerText =
        "Creating account...";

    const {
        data,
        error
    } = await db.auth.signUp({
        email,
        password
    });

    if (error) {
        message.innerText = error.message;
        return;
    }

    if (data.session) {
        currentUser = data.user;
        updateAccountButton();

        await loadAds();
        showProfile();
    } else {
        message.innerText =
            "Account created. Check your email for the confirmation link.";
    }
}

async function login() {
    const email =
        document.getElementById("authEmail").value.trim();

    const password =
        document.getElementById("authPassword").value;

    const message =
        document.getElementById("authMessage");

    if (!email || !password) {
        message.innerText =
            "Enter your email and password.";
        return;
    }

    message.innerText =
        "Logging in...";

    const {
        data,
        error
    } = await db.auth.signInWithPassword({
        email,
        password
    });

    if (error) {
        message.innerText = error.message;
        return;
    }

    currentUser = data.user;
    message.innerText = "";

    updateAccountButton();

    await loadAds();
    showProfile();
}

async function logout() {
    await db.auth.signOut();

    currentUser = null;
    updateAccountButton();

    await loadAds();
    showSupported();
}

/* Keep UI updated if auth changes */

db.auth.onAuthStateChange(
    (event, session) => {
        currentUser =
            session?.user || null;

        updateAccountButton();
    }
);

/* ========================================
   CREATE CARD
======================================== */

function createCard(ad, rank = null, showOwnerControls = false) {
    const card =
        document.createElement("article");

    card.className = "card";

    card.innerHTML = `
        <div class="image-container">

            ${
                rank
                    ? `<div class="rank">#${rank}</div>`
                    : ""
            }

            <img
                src="${escapeHTML(ad.image)}"
                alt="${escapeHTML(ad.title)}"
            >
        </div>

        <div class="caption">

            <h2>
                ${escapeHTML(ad.title)}
            </h2>

            <p>
                ${escapeHTML(ad.caption)}
            </p>

            <div class="stats">
                <span class="like-count">
                    ♡ ${ad.likes.toLocaleString()} likes
                </span>

                <span class="money">
                    $${ad.support.toFixed(2)} supported
                </span>
            </div>

            <div class="action-buttons">

                <button
                    class="like-button ${ad.liked ? "liked" : ""}"
                    onclick="toggleLike(${ad.id})"
                >
                    ${ad.liked ? "♥ Liked" : "♡ Like"}
                </button>

                <button
                    class="support-button"
                    onclick="openSupport(${ad.id}, this)"
                >
                    ⚡ Support
                </button>

            </div>

            ${
                ad.owner && showOwnerControls
                    ? `
                        <button
                            class="edit-ad-button"
                            onclick="openEditAd(${ad.id})"
                        >
                            Edit Ad
                        </button>
                    `
                    : ""
            }

        </div>
    `;

    return card;
}

/* ========================================
   MOST SUPPORTED
======================================== */

function showSupported() {
    showGallery();

    gallery.classList.remove("show-likes");
    gallery.classList.add("show-support");

    pageTitle.innerText =
        "Most Supported";

    pageDescription.innerText =
        "The ads people have put the most support behind.";

    setNav("supportedNav");

    const sorted =
        [...ads].sort(
            (a, b) => b.support - a.support
        );

    renderGallery(sorted);
}

/* ========================================
   MOST LIKED
======================================== */

function showMostLiked() {
    showGallery();

    gallery.classList.remove("show-support");
    gallery.classList.add("show-likes");

    pageTitle.innerText =
        "Most Liked";

    pageDescription.innerText =
        "The ads the internet likes most.";

    setNav("likedNav");

    const sorted =
        [...ads].sort(
            (a, b) => b.likes - a.likes
        );

    renderGallery(sorted);
}

/* ========================================
   GALLERY
======================================== */

function renderGallery(list) {
    gallery.innerHTML = "";

    if (list.length === 0) {
        gallery.innerHTML = `
            <div class="empty-message">
                No ads yet.
            </div>
        `;
        return;
    }

    list.forEach((ad, index) => {
        gallery.appendChild(
            createCard(ad, index + 1)
        );
    });
}

/* ========================================
   LIKE
======================================== */

async function toggleLike(id) {
    if (!currentUser) {
        showLogin();

        document
            .getElementById("authMessage")
            .innerText =
                "Log in to like ads.";

        return;
    }

    const ad =
        ads.find(ad => ad.id === id);

    if (!ad) return;

    if (ad.liked) {
        const { error } = await db
            .from("likes")
            .delete()
            .eq("ad_id", id)
            .eq("user_id", currentUser.id);

        if (error) {
            console.error(error);
            alert(
                "Couldn't remove like: " +
                error.message
            );
            return;
        }
    } else {
        const { error } = await db
            .from("likes")
            .insert({
                ad_id: id,
                user_id: currentUser.id
            });

        if (error) {
            console.error(error);
            alert(
                "Couldn't save like: " +
                error.message
            );
            return;
        }
    }

    await loadAds();
    refreshCurrentView();
}

/* ========================================
   SUPPORT
   DEMO ONLY — NO REAL PAYMENT YET
======================================== */

function openSupport(id, button) {
    if (!currentUser) {
        showLogin();

        document
            .getElementById("authMessage")
            .innerText =
                "Log in to support ads.";

        return;
    }

    document
        .querySelectorAll(".support-box")
        .forEach(box => box.remove());

    const box =
        document.createElement("div");

    box.className = "support-box";

    box.innerHTML = `
        <div class="support-question">
            How much would you like to support?
        </div>

        <div class="amount-entry">
            <span>$</span>

            <input
                type="number"
                min="0.01"
                step="0.01"
                placeholder="5.00"
            >
        </div>

        <button class="confirm-support">
            ⚡ Support
        </button>

        <button class="cancel-support">
            Cancel
        </button>
    `;

    button
        .closest(".caption")
        .appendChild(box);

    const input =
        box.querySelector("input");

    const confirm =
        box.querySelector(".confirm-support");

    const cancel =
        box.querySelector(".cancel-support");

    input.focus();

    input.addEventListener(
        "input",
        () => {
            const amount =
                parseFloat(input.value);

            confirm.innerText =
                amount > 0
                    ? `⚡ Support $${amount.toFixed(2)}`
                    : "⚡ Support";
        }
    );

    input.addEventListener(
        "keydown",
        event => {
            if (event.key === "Enter") {
                confirm.click();
            }
        }
    );

    confirm.onclick = () => {
        const amount =
            parseFloat(input.value);

        if (!amount || amount <= 0) {
            input.focus();
            return;
        }

        const ad =
            ads.find(ad => ad.id === id);

        if (!ad) return;

        /*
            DEMO ONLY.
            No money is charged and nothing is
            written to the supports table yet.
        */

        ad.support += amount;
        ad.userSupport += amount;

        refreshCurrentView();
    };

    cancel.onclick =
        () => box.remove();
}

/* ========================================
   POST AD
======================================== */

async function postAd() {
    if (!currentUser) {
        showLogin();
        return;
    }

    const title =
        document.getElementById("newTitle").value.trim();

    const caption =
        document.getElementById("newCaption").value.trim();

    const imageInput =
        document.getElementById("newImage");

    const imageFile =
        imageInput.files[0];

    if (!title || !caption || !imageFile) {
        alert(
            "Please add a title, image and caption."
        );
        return;
    }

    if (imageFile.size > 10 * 1024 * 1024) {
        alert(
            "Please choose an image smaller than 10 MB."
        );
        return;
    }

    const rawExtension =
        imageFile.name.includes(".")
            ? imageFile.name.split(".").pop()
            : "jpg";

    const extension =
        rawExtension
            .toLowerCase()
            .replace(/[^a-z0-9]/g, "") || "jpg";

    const fileName =
        `${currentUser.id}/${crypto.randomUUID()}.${extension}`;

    const {
        error: uploadError
    } = await db.storage
        .from("ad-images")
        .upload(
            fileName,
            imageFile,
            {
                cacheControl: "3600",
                upsert: false
            }
        );

    if (uploadError) {
        console.error(
            "Image upload failed:",
            uploadError
        );

        alert(
            "Couldn't upload image: " +
            uploadError.message
        );

        return;
    }

    const {
        data: publicUrlData
    } = db.storage
        .from("ad-images")
        .getPublicUrl(fileName);

    const imageUrl =
        publicUrlData.publicUrl;

    const {
        error: adError
    } = await db
        .from("ads")
        .insert({
            user_id: currentUser.id,
            title,
            caption,
            image_url: imageUrl
        });

    if (adError) {
        console.error(
            "Couldn't create ad:",
            adError
        );

        /*
            Clean up the image if the ad row fails.
        */
        await db.storage
            .from("ad-images")
            .remove([fileName]);

        alert(
            "Couldn't create the ad: " +
            adError.message
        );

        return;
    }

    document.getElementById("newTitle").value = "";
    document.getElementById("newCaption").value = "";
    imageInput.value = "";

    await loadAds();

    showProfile();
    profileSection("myads");
}

/* ========================================
   EDIT AD
======================================== */

function openEditAd(id) {
    if (!currentUser) return;

    const ad =
        ads.find(ad => ad.id === id);

    if (!ad || !ad.owner) {
        alert("You can only edit your own ads.");
        return;
    }

    editingAdId = id;

    editTitle.value =
        ad.title;

    editCaption.value =
        ad.caption;

    editImage.value = "";

    editOverlay.style.display =
        "block";
}

function closeEditAd() {
    editOverlay.style.display =
        "none";

    editingAdId = null;
    editImage.value = "";
}

async function saveAdEdits() {
    if (!currentUser || editingAdId === null) {
        return;
    }

    const ad =
        ads.find(ad => ad.id === editingAdId);

    if (!ad || !ad.owner) {
        alert("You can only edit your own ads.");
        return;
    }

    const title =
        editTitle.value.trim();

    const caption =
        editCaption.value.trim();

    const replacementImage =
        editImage.files[0];

    if (!title || !caption) {
        alert("Please add a title and caption.");
        return;
    }

    let newImageUrl =
        ad.image;

    let newImagePath =
        null;

    if (replacementImage) {
        if (
            replacementImage.size >
            10 * 1024 * 1024
        ) {
            alert(
                "Please choose an image smaller than 10 MB."
            );
            return;
        }

        const rawExtension =
            replacementImage.name.includes(".")
                ? replacementImage.name.split(".").pop()
                : "jpg";

        const extension =
            rawExtension
                .toLowerCase()
                .replace(/[^a-z0-9]/g, "") || "jpg";

        newImagePath =
            `${currentUser.id}/${crypto.randomUUID()}.${extension}`;

        const {
            error: uploadError
        } = await db.storage
            .from("ad-images")
            .upload(
                newImagePath,
                replacementImage,
                {
                    cacheControl: "3600",
                    upsert: false
                }
            );

        if (uploadError) {
            console.error(
                "Replacement image upload failed:",
                uploadError
            );

            alert(
                "Couldn't upload the new image: " +
                uploadError.message
            );

            return;
        }

        const {
            data: publicUrlData
        } = db.storage
            .from("ad-images")
            .getPublicUrl(newImagePath);

        newImageUrl =
            publicUrlData.publicUrl;
    }

    const {
        error: updateError
    } = await db
        .from("ads")
        .update({
            title,
            caption,
            image_url: newImageUrl
        })
        .eq("id", editingAdId)
        .eq("user_id", currentUser.id);

    if (updateError) {
        console.error(
            "Couldn't update ad:",
            updateError
        );

        if (newImagePath) {
            await db.storage
                .from("ad-images")
                .remove([newImagePath]);
        }

        alert(
            "Couldn't save changes: " +
            updateError.message
        );

        return;
    }

    /*
        If the user replaced the image and the old image
        is one of our Supabase Storage images, remove it.
    */
    if (
        replacementImage &&
        ad.image
    ) {
        try {
            const marker =
                "/storage/v1/object/public/ad-images/";

            if (ad.image.includes(marker)) {
                const oldImagePath =
                    decodeURIComponent(
                        ad.image.split(marker)[1]
                    );

                const {
                    error: oldImageError
                } = await db.storage
                    .from("ad-images")
                    .remove([oldImagePath]);

                if (oldImageError) {
                    console.error(
                        "Old image cleanup failed:",
                        oldImageError
                    );
                }
            }
        } catch (error) {
            console.error(
                "Old image cleanup failed:",
                error
            );
        }
    }

    closeEditAd();

    await loadAds();

    showProfile();
    profileSection("myads");
}

async function deleteCurrentAd() {
    if (editingAdId === null) return;

    const id =
        editingAdId;

    closeEditAd();

    await deleteAd(id);
}

/* ========================================
   DELETE AD
======================================== */

async function deleteAd(id) {
    if (!currentUser) return;

    const ad =
        ads.find(ad => ad.id === id);

    if (!ad || !ad.owner) {
        alert(
            "You can only delete your own ads."
        );
        return;
    }

    const confirmed =
        confirm(
            `Delete "${ad.title}"? This cannot be undone.`
        );

    if (!confirmed) return;

    const {
        error: deleteError
    } = await db
        .from("ads")
        .delete()
        .eq("id", id)
        .eq("user_id", currentUser.id);

    if (deleteError) {
        console.error(deleteError);

        alert(
            "Couldn't delete the ad: " +
            deleteError.message
        );

        return;
    }

    /*
        If this is one of our Supabase Storage images,
        also remove the file from ad-images.
    */
    try {
        const marker =
            "/storage/v1/object/public/ad-images/";

        if (
            ad.image &&
            ad.image.includes(marker)
        ) {
            const imagePath =
                decodeURIComponent(
                    ad.image.split(marker)[1]
                );

            const {
                error: imageError
            } = await db.storage
                .from("ad-images")
                .remove([imagePath]);

            if (imageError) {
                console.error(
                    "Image cleanup failed:",
                    imageError
                );
            }
        }
    } catch (error) {
        console.error(
            "Image cleanup failed:",
            error
        );
    }

    await loadAds();

    showProfile();
    profileSection("myads");
}

/* ========================================
   POST PAGE
======================================== */

function showPost() {
    if (!currentUser) {
        showLogin();

        document
            .getElementById("authMessage")
            .innerText =
                "Create an account or log in to post an ad.";

        return;
    }

    hideAll();

    submitArea.style.display =

/* ========================================
   PROFILE
======================================== */

function showProfile() {
    if (!currentUser) {
        showLogin();
        return;
    }

    hideAll();

    profilePanel.style.display =
        "block";

    pageTitle.innerText =
        "Your Profile";

    pageDescription.innerText =
        "Your ads, likes and support.";

    setNav("profileNav");

    profileSection("myads");
}

function profileSection(section) {
    document
        .querySelectorAll(".profile-tabs button")
        .forEach(
            button =>
                button.classList.remove("active")
        );

    let list = [];

    if (section === "myads") {
        document
            .getElementById("myAdsTab")
            .classList.add("active");

        list =
            ads.filter(ad => ad.owner);
    }

    if (section === "liked") {
        document
            .getElementById("myLikesTab")
            .classList.add("active");

        list =
            ads.filter(ad => ad.liked);
    }

    if (section === "supported") {
        document
            .getElementById("mySupportedTab")
            .classList.add("active");

        list =
            ads.filter(
                ad => ad.userSupport > 0
            );
    }

    profileContent.innerHTML = "";

    if (list.length === 0) {
        let message =
            "Nothing here yet.";

        if (section === "myads") {
            message =
                "You haven't posted an ad yet.";
        }

        if (section === "liked") {
            message =
                "You haven't liked any ads yet.";
        }

        if (section === "supported") {
            message =
                "You haven't supported any ads yet.";
        }

        profileContent.innerHTML = `
            <div class="empty-message">
                ${message}
            </div>
        `;

        return;
    }

    list.forEach(ad => {
        const showOwnerControls =
            section === "myads";

        profileContent.appendChild(
            createCard(
                ad,
                null,
                showOwnerControls
            )
        );
    });
}

/* ========================================
   HELPERS
======================================== */

function hideAll() {
    gallery.style.display =
        "none";

    submitArea.style.display =
        "none";

    authArea.style.display =
        "none";

    profilePanel.style.display =
        "none";
}

function showGallery() {
    hideAll();

    gallery.style.display =
        "grid";
}

function setNav(id) {
    document
        .querySelectorAll("nav button")
        .forEach(
            button =>
                button.classList.remove("active")
        );

    if (id) {
        document
            .getElementById(id)
            .classList.add("active");
    }
}

function refreshCurrentView() {
    if (
        document
            .getElementById("supportedNav")
            .classList
            .contains("active")
    ) {
        showSupported();
        return;
    }

    if (
        document
            .getElementById("likedNav")
            .classList
            .contains("active")
    ) {
        showMostLiked();
        return;
    }

    if (
        document
            .getElementById("profileNav")
            .classList
            .contains("active")
    ) {
        showProfile();
        return;
    }

    showSupported();
}

function escapeHTML(text) {
    const div =
        document.createElement("div");

    div.textContent =
        text == null ? "" : String(text);

    return div.innerHTML;
}

/* ========================================
   LOAD REAL DATA
======================================== */

async function loadAds() {
    const {
        data: adData,
        error: adError
    } = await db
        .from("ads")
        .select("*")
        .order(
            "created_at",
            { ascending: false }
        );

    if (adError) {
        console.error(
            "Couldn't load ads:",
            adError
        );
        return;
    }

    const {
        data: likeData,
        error: likeError
    } = await db
        .from("likes")
        .select("ad_id, user_id");

    if (likeError) {
        console.error(
            "Couldn't load likes:",
            likeError
        );
        return;
    }

    ads = adData.map(ad => {
        const adLikes =
            likeData.filter(
                like => like.ad_id === ad.id
            );

        const userLiked =
            currentUser
                ? adLikes.some(
                    like =>
                        like.user_id === currentUser.id
                )
                : false;

        return {
            id: ad.id,
            title: ad.title,
            caption: ad.caption || "",
            image: ad.image_url,
            likes: adLikes.length,
            liked: userLiked,
            support:
                Number(ad.support_total) || 0,

            /*
                Real support history will be added
                when Stripe is connected.
            */
            userSupport: 0,

            owner:
                currentUser
                    ? ad.user_id === currentUser.id
                    : false
        };
    });
}

/* Close the edit panel when clicking outside it */

editOverlay.addEventListener(
    "click",
    event => {
        if (event.target === editOverlay) {
            closeEditAd();
        }
    }
);

document.addEventListener(
    "keydown",
    event => {
        if (
            event.key === "Escape" &&
            editOverlay.style.display === "block"
        ) {
            closeEditAd();
        }
    }
);

/* ========================================
   START
======================================== */

async function startApp() {
    await checkUser();
    await loadAds();

    showSupported();

    console.log(
        "AdBattle connected to Supabase."
    );
}

startApp();
