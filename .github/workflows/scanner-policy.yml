name: Ad scanner policy responses

on:
  pull_request:
    branches: [main, wallet-ledger-90-10, feat/ai-media-integration]
    paths:
      - '.github/workflows/scanner-policy.yml'
      - 'supabase/functions/scan-ad/**'
      - 'supabase/migrations/*safety_scan_claim_lease.sql'
      - 'tests/safety_scanner.test.mjs'
      - 'tests/scanner_policy_response.test.mjs'
      - 'tests/safety_scan_claim_lease.test.mjs'
      - 'tests/fixtures/images/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scanner-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test tests/safety_scanner.test.mjs tests/scanner_policy_response.test.mjs tests/safety_scan_claim_lease.test.mjs
